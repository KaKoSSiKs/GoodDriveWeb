version: '3.8'

services:
  # MySQL Database (Development)
  mysql:
    image: mysql:8.0
    container_name: gooddrive-mysql-dev
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gooddrive_db}
      MYSQL_USER: ${MYSQL_USER:-gooddrive_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gooddrive_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/mysql/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - gooddrive-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SvelteKit Development Server
  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile.dev
    container_name: gooddrive-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-gooddrive_user}:${MYSQL_PASSWORD:-gooddrive_password}@mysql:3306/${MYSQL_DATABASE:-gooddrive_db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      NODE_ENV: development
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gooddrive-dev-network
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.svelte-kit

  # PhpMyAdmin (Development only)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gooddrive-phpmyadmin-dev
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-gooddrive_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-gooddrive_password}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - gooddrive-dev-network

volumes:
  mysql_dev_data:
    driver: local

networks:
  gooddrive-dev-network:
    driver: bridge
