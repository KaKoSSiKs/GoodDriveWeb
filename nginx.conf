# Конфигурация nginx для nikitintex.ru
# Этот файл нужно скопировать на сервер в /etc/nginx/sites-available/nikitintex.ru
# и создать символическую ссылку в /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name nikitintex.ru www.nikitintex.ru;

    # Логи
    access_log /var/log/nginx/nikitintex.ru.access.log;
    error_log /var/log/nginx/nikitintex.ru.error.log;

    # Максимальный размер загружаемых файлов
    client_max_body_size 50M;

    # Проксирование на Node.js приложение
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # Заголовки для правильной работы прокси
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket поддержка (если нужно)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Буферизация
        proxy_buffering off;
    }

    # Кэширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, immutable";
        expires 30d;
    }

    # Health check endpoint (опционально)
    location /api/health {
        proxy_pass http://localhost:3000;
        access_log off;
    }
}

