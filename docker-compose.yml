services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: gooddrive-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --local-infile=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gooddrive_db}
      MYSQL_USER: ${MYSQL_USER:-gooddrive_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gooddrive_password}
    # Порт не пробрасываем наружу - приложение подключается через внутреннюю сеть Docker
    # Раскомментируйте следующую строку, если нужен доступ к MySQL с хоста
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/mysql/data.csv:/docker-entrypoint-initdb.d/data.csv:ro
    networks:
      - gooddrive-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  # SvelteKit Application
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
        PUBLIC_YM_COUNTER_ID: ${PUBLIC_YM_COUNTER_ID:-}
        PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
        PUBLIC_GOOGLE_VERIFICATION: ${PUBLIC_GOOGLE_VERIFICATION:-}
        PUBLIC_YANDEX_VERIFICATION: ${PUBLIC_YANDEX_VERIFICATION:-}
    container_name: gooddrive-app
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-gooddrive_user}:${MYSQL_PASSWORD:-gooddrive_password}@mysql:3306/${MYSQL_DATABASE:-gooddrive_db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gooddrive-network
    volumes:
      - ./static:/app/static:ro
      - ./docker/mysql/data.csv:/app/docker/mysql/data.csv:ro
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "
        echo '⏳ Ожидание готовности MySQL...' &&
        sleep 5 &&
        echo '🚀 Применение миграций Prisma...' &&
        for i in 1 2 3 4 5; do
          npx prisma migrate deploy && break || {
            echo \"⚠️ Попытка $$i/5 не удалась, повтор через 5 секунд...\" &&
            sleep 5
          }
        done &&
        echo '✅ Миграции применены' &&
        echo '' &&
        echo '📦 Импорт данных из CSV...' &&
        node scripts/import-data.js || echo '⚠️ Импорт данных пропущен (данные уже есть или ошибка)' &&
        echo '✅ Импорт завершен' &&
        echo '' &&
        echo '🚀 Запуск приложения...' &&
        node build/index.js
      "
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gooddrive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - gooddrive-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
  certbot_data:
    driver: local
  certbot_etc:
    driver: local

networks:
  gooddrive-network:
    driver: bridge
