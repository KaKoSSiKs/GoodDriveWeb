services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: gooddrive-db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gooddrive-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SvelteKit Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # ARG для передачи переменных во время сборки (build time)
      # PUBLIC_* переменные должны быть доступны во время сборки SvelteKit
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
        PUBLIC_YM_COUNTER_ID: ${PUBLIC_YM_COUNTER_ID:-}
        PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
        PUBLIC_GOOGLE_VERIFICATION: ${PUBLIC_GOOGLE_VERIFICATION:-}
        PUBLIC_YANDEX_VERIFICATION: ${PUBLIC_YANDEX_VERIFICATION:-}
    container_name: gooddrive-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Переменные окружения для runtime
      DATABASE_URL: ${DATABASE_URL:-mysql://appuser:apppassword@db:3306/appdb}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      NODE_ENV: production
      PORT: 3000
      # Лимит импорта данных (0 = все строки, по умолчанию 100)
      IMPORT_LIMIT: ${IMPORT_LIMIT:-100}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gooddrive-network
    volumes:
      - ./static:/app/static
    # Команда запуска: миграции -> импорт данных -> запуск приложения
    command: >
      sh -c "
        echo '🚀 Применение миграций Prisma...' &&
        npx prisma migrate deploy &&
        echo '✅ Миграции применены' &&
        echo '' &&
        echo '📦 Импорт данных из CSV...' &&
        node scripts/import-data.js &&
        echo '✅ Импорт данных завершен' &&
        echo '' &&
        echo '🚀 Запуск приложения...' &&
        node build/index.js
      "
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
    driver: local

networks:
  gooddrive-network:
    driver: bridge
