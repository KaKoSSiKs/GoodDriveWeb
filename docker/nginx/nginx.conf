# Production nginx конфигурация для SvelteKit приложения
# Используется внутри Docker контейнера

upstream app {
    server app:3000;
    keepalive 64;
}

# Редирект HTTP на HTTPS (для production с SSL)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект на HTTPS (раскомментировать после установки SSL)
    # return 301 https://$host$request_uri;
    
    # Временный прокси на HTTP (для первоначальной настройки)
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

